<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>{% block title %}EV SCOUTING{% endblock %} // WATERLOO EV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">WLOO/EV</span>
      <span class="brand-sub">PIT TELEMETRY · v1</span>
    </div>
    <nav class="tabs">
      <a href="/" data-route="dashboard"><span class="dot"></span>PIT WALL</a>
      <a href="/scout" data-route="scout"><span class="dot"></span>SPOTTER</a>
      <a href="/self" data-route="self"><span class="dot"></span>DRIVER</a>
    </nav>
    <div class="clock">
      <span class="clock-label">LOCAL</span>
      <span id="topclock" class="clock-time">--:--:--</span>
    </div>
  </header>

  <div class="hazard" aria-hidden="true"></div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footbar">
    <span>CH. 01 · 1000 M CIRCUIT</span>
    <span class="grow"></span>
    <span class="live-pip"><span class="pip"></span>BROADCAST</span>
  </footer>

  <script>
    // Live local clock in the topbar.
    (function () {
      const el = document.getElementById('topclock');
      const pad = n => String(n).padStart(2, '0');
      function tick() {
        const d = new Date();
        el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }
      tick(); setInterval(tick, 1000);
    })();

    // Mark active tab.
    (function () {
      const p = location.pathname;
      const route = p === '/' ? 'dashboard' : p === '/scout' ? 'scout' : p === '/self' ? 'self' : '';
      document.querySelectorAll('.tabs a').forEach(a => {
        if (a.dataset.route === route) a.classList.add('on');
      });
    })();
  </script>
</body>
</html>
